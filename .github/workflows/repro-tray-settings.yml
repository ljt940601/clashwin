# TEMPORARY: reproduces "tray menu → Settings flashes and closes" on a Windows runner.
# Builds the release exe, runs it with CLASHWIN_SELFTEST (see src-tauri/src/selftest.rs),
# takes screenshots and prints the app log. Removed once the bug is fixed.
name: Repro tray settings

on:
  push:
    branches: [claude/sweet-ptolemy-y2q6jn]
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Rust build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable

      - run: npm ci

      - name: Build
        run: npx tauri build --no-bundle

      - name: Run repro
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\cw"
          $shots = "$env:RUNNER_TEMP\shots"
          New-Item -ItemType Directory -Force $shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          "Screen: $([System.Windows.Forms.SystemInformation]::VirtualScreen)"
          $env:CLASHWIN_SELFTEST = "1"
          $env:CLASHWIN_DATA_DIR = $data
          $app = Start-Process -FilePath "src-tauri\target\release\clashwin.exe" -ArgumentList "--autostart" -PassThru
          Start-Sleep 3
          $np = Start-Process notepad -PassThru
          for ($i = 0; $i -lt 110; $i++) {
            Start-Sleep -Milliseconds 400
            try { Shot ("{0:D3}_{1}" -f $i, (Get-Date -Format "HHmmss.fff")) } catch { "shot $i failed: $_" }
            if ($app.HasExited) { "app exited with code $($app.ExitCode) at shot $i"; break }
          }
          if (!$app.HasExited) { "app still running, stopping it"; Stop-Process -Id $app.Id -Force }
          Stop-Process -Id $np.Id -Force -ErrorAction SilentlyContinue
          "===== clashwin.log ====="
          Get-Content "$data\logs\clashwin.log"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          retention-days: 3
