# Tag only after the matching candidate has passed real Windows desktop QA.
# Promote the exact candidate installer; do not rebuild after desktop validation.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '${{ github.sha }}'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref }}' -ne "refs/tags/v$version") { throw 'Release requires the matching version tag.' }
          $runs = gh api "repos/${{ github.repository }}/actions/workflows/release-candidate.yml/runs?head_sha=$sha&status=success&per_page=20" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read candidate runs.' }
          $run = $runs.workflow_runs | Where-Object { $_.head_sha -eq $sha -and $_.conclusion -eq 'success' } | Select-Object -First 1
          if (-not $run) { throw 'No successful candidate for the tagged commit.' }
          gh run download $run.id --repo '${{ github.repository }}' --name "ClashWin-candidate-$sha" --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download candidate.' }
          $info = Get-Content candidate/build-info.json -Raw | ConvertFrom-Json
          $name = "ClashWin_${version}_x64-setup.exe"
          if ($info.commit -ne $sha -or $info.version -ne $version -or $info.installer -ne $name) { throw 'Candidate metadata mismatch.' }
          if ((Get-FileHash "candidate/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $info.sha256) { throw 'Installer hash mismatch.' }
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" "candidate/ClashWin_${version}_x64-setup.exe" candidate/SHA256SUMS.txt --verify-tag --title "ClashWin v$version" --notes-file ".github/release-notes/v$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
