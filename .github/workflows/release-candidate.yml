name: Release candidate

on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain
        run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: npm ci
      - name: Rust regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build release installer
        run: npx tauri build --bundles nsis
      - name: Collect release candidate
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "ClashWin_${version}_x64-setup.exe"
          New-Item -ItemType Directory candidate | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/$name" "candidate/$name"
          Copy-Item src-tauri/target/release/clashwin.exe candidate/clashwin.exe
          $hash = (Get-FileHash "candidate/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content candidate/SHA256SUMS.txt -Encoding utf8
          @{ commit = '${{ github.sha }}'; version = $version; installer = $name; sha256 = $hash } |
            ConvertTo-Json | Set-Content candidate/build-info.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ClashWin-candidate-${{ github.sha }}
          path: candidate/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      # Production output is already saved. Only the validation copy enables
      # DevTools and uses a separate single-instance identity for desktop QA.
      - name: Build isolated desktop validation executable
        shell: pwsh
        run: |
          @{ identifier = 'app.clashwin.releasevalidation'; productName = 'ClashWin Release Validation' } |
            ConvertTo-Json | Set-Content src-tauri/tauri.validation.conf.json -Encoding utf8
          $path = 'src-tauri/src/windows.rs'
          $source = Get-Content $path -Raw
          $source.Replace('.title("ClashWin")', '.title("ClashWin Release Validation").devtools(true)') |
            Set-Content $path -Encoding utf8
          npx tauri build --no-bundle --features tauri/devtools --config src-tauri/tauri.validation.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory validation | Out-Null
          Copy-Item src-tauri/target/release/clashwin.exe validation/ClashWin-Validation.exe
          $hash = (Get-FileHash validation/ClashWin-Validation.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ commit = '${{ github.sha }}'; identifier = 'app.clashwin.releasevalidation'; sha256 = $hash } |
            ConvertTo-Json | Set-Content validation/build-info.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ClashWin-validation-${{ github.sha }}
          path: validation/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
