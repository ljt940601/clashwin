<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClashWin</title>
    <script>
      // Paint the first frame in the last-used theme (saved by the app) so the window
      // doesn't flash the wrong colour while the bundle loads. The tray popup stays transparent.
      (function () {
        if (location.hash.indexOf("#/tray") === 0) return;
        var t = null;
        try {
          t = localStorage.getItem("clashwin.theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.background = t === "dark" ? "#1e1f21" : "#f5f5f7";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
