[package]
name = "clashwin"
version = "0.2.4"
description = "ClashWin - a native-feeling mihomo client for Windows"
authors = ["ClashWin"]
edition = "2021"
default-run = "clashwin"

[lib]
name = "clashwin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-process = "2.4"
tauri-plugin-global-shortcut = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "json"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.32"
maxminddb = "0.24"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
parking_lot = "0.12"
log = "0.4"
png = "0.17"
base64 = "0.22"
rand = "0.8"
url = "2"
once_cell = "1"
regex = "1"
percent-encoding = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Same version as Tauri's, to share the dashboard's WebView2 environment (windows.rs)
webview2-com = "0.39"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_JobObjects",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Time",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_ProcessStatus",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinInet",
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
